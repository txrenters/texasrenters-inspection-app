# Temporary remote iOS beta overlay. Not production.
#
#   docker compose --env-file backend/.env.local \
#     -f compose.yaml -f compose.remote-beta.yaml up -d --build
#
# Or simply: npm run remote-beta
#
# This is an overlay on compose.yaml, not a rival stack. It joins the same
# `texasrenters` project and the same network, so the Redis defined in
# compose.yaml is the Redis the backend actually reaches. The previous
# standalone file created a second project with a second Redis, which is why
# admin diagnostics reported the cache as unconfigured while a Redis container
# was plainly running.
#
# Credentials come from the ignored backend/.env.local file and are injected at
# runtime. They never reach an image layer or a client.

services:
  backend:
    environment:
      NODE_ENV: production
      APP_ENV: remote-beta
      # USE_MOCK_AUTH was pinned 'false' here to hold the public beta boundary.
      # The variable no longer exists — there is only real authentication now —
      # so the boundary is a property of the code rather than of this file.
      # Expo web for mobile runs on 8082 during remote-beta development.
      MOBILE_APP_ORIGIN: http://localhost:8082
      # The console's public origin. This is not only a CORS entry — report-share
      # links, invitations and password resets are all built from it, so leaving
      # it on localhost hands a remote tester URLs that only work on this machine.
      # allowedCorsOrigins() merges it into the CORS list too.
      WEB_APP_ORIGIN: https://inspection-tx.erniecodev.win
    ports:
      # The tunnel is the only public entry point. The host binding stays
      # loopback — Cloudflare reaches this over the Compose network by service
      # name, so nothing needs publishing to reach the internet.
      - '127.0.0.1:${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'

  web:
    ports:
      # The admin app is not part of the tester-facing tunnel.
      - '127.0.0.1:${WEB_PORT:-5454}:${WEB_PORT:-5454}'

  # There is no nginx gateway any more.
  #
  # It existed for one reason: a free ngrok account gets a single agent session,
  # so the REST API, websockets and Metro all had to share one URL and be split
  # apart again by path. Cloudflare publishes a hostname per service, so each
  # one now points straight at what serves it and nothing passes through a
  # proxy we maintain.
  #
  # Deleting it removed a real failure mode, not just a container. nginx
  # resolved its upstreams once at startup, so rebuilding the backend gave it a
  # new address that nginx kept missing — every request 502'd while the backend
  # itself was perfectly healthy, which reads as a broken tunnel. The workaround
  # was a `resolver` directive and hostnames held in variables. cloudflared
  # resolves per request and needs none of it.

  # Cloudflare Tunnel, replacing ngrok.
  #
  # The reason is availability, not preference. The free ngrok agent holds a
  # single session that drops and takes the beta down with it; cloudflared opens
  # four redundant edge connections and re-establishes them itself, so a dropped
  # link is invisible rather than an outage.
  #
  # Routing lives in the Cloudflare dashboard, not here. A token-based tunnel
  # pulls its ingress rules from Zero Trust → Networks → Tunnels → Public
  # Hostnames, which is why this command names no upstream. Because this
  # container sits on the Compose network, a public hostname can point at any of
  # these service URLs:
  #
  #   http://backend:3000               REST API and websockets
  #   http://host.docker.internal:8082  Metro (runs on the host, not a container)
  #   http://web:5454                   the administrator app
  #
  # Currently published:
  #   backend.erniecodev.win -> http://backend:3000
  #   mobile.erniecodev.win  -> http://host.docker.internal:8082
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is missing from backend/.env.local}
    # Metro runs on the Windows host, not in a container, so the hostname routed
    # to it names host.docker.internal. Docker Desktop supplies that
    # automatically; the explicit mapping is what keeps this working on a Linux
    # engine.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # cloudflared's own metrics, which is where /ready lives — the readiness
      # signal that replaces ngrok's tunnel-listing API. Loopback only: it
      # reports connection state, not a public surface.
      - '127.0.0.1:2000:2000'
    # No healthcheck, deliberately.
    #
    # The image is distroless: there is no /bin/sh and no curl, so CMD-SHELL
    # cannot run and nothing in the container can reach its own /ready endpoint.
    # A first attempt here used CMD-SHELL and reported the tunnel `unhealthy`
    # for its whole life while it was carrying traffic perfectly well — a
    # healthcheck that lies is worse than none.
    #
    # The real signal is /ready on the published metrics port, which reports
    # registered edge connections rather than merely that a process exists.
    # `npm run remote-beta` and `npm run remote-beta:status` both read it.
    restart: unless-stopped
