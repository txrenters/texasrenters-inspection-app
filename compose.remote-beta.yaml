# Temporary remote iOS beta overlay. Not production.
#
#   docker compose --env-file backend/.env.local \
#     -f compose.yaml -f compose.remote-beta.yaml up -d --build
#
# Or simply: pnpm remote-beta
#
# This is an overlay on compose.yaml, not a rival stack. It joins the same
# `texasrenters` project and the same network, so the Redis defined in
# compose.yaml is the Redis the backend actually reaches. The previous
# standalone file created a second project with a second Redis, which is why
# admin diagnostics reported the cache as unconfigured while a Redis container
# was plainly running.
#
# Credentials come from the ignored backend/.env.local file and are injected at
# runtime. They never reach an image layer or a client.

services:
  backend:
    environment:
      NODE_ENV: production
      APP_ENV: remote-beta
      # The public beta boundary must always use real authentication.
      USE_MOCK_AUTH: 'false'
      # Expo web for mobile runs on 8082 during remote-beta development.
      MOBILE_APP_ORIGIN: http://localhost:8082
    ports:
      # The tunnel is the only public entry point. The host binding stays
      # loopback — Cloudflare reaches this over the Compose network by service
      # name, so nothing needs publishing to reach the internet.
      - '127.0.0.1:${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'

  web:
    ports:
      # The admin app is not part of the tester-facing tunnel.
      - '127.0.0.1:${WEB_PORT:-5454}:${WEB_PORT:-5454}'

  # Path-routes one hostname across the REST API, websockets, and Metro.
  #
  # Originally here because a free ngrok account gets one agent session, so
  # everything had to share a URL. Cloudflare removes that constraint — a
  # hostname per service is fine now — but one origin serving both Metro and the
  # API is still the simplest thing to point a test device at.
  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./docker/nginx/remote-beta.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    # Docker Desktop provides this name automatically. The explicit mapping also
    # keeps the file usable on modern Linux Docker engines.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # Cloudflare Tunnel, replacing ngrok.
  #
  # The reason is availability, not preference. The free ngrok agent holds a
  # single session that drops and takes the beta down with it; cloudflared opens
  # four redundant edge connections and re-establishes them itself, so a dropped
  # link is invisible rather than an outage.
  #
  # Routing lives in the Cloudflare dashboard, not here. A token-based tunnel
  # pulls its ingress rules from Zero Trust → Networks → Tunnels → Public
  # Hostnames, which is why this command names no upstream. Because this
  # container sits on the Compose network, a public hostname can point at any of
  # these service URLs:
  #
  #   http://gateway:80                 one hostname, path-routed:
  #                                       /api/ and /socket.io/ → backend
  #                                       everything else       → Metro
  #   http://backend:3000               the REST API and websockets on their own
  #   http://web:5454                   the administrator app on its own
  #   http://host.docker.internal:8082  Metro directly
  #
  # Per-hostname routing is the better shape now that Cloudflare can do it:
  # the gateway existed to multiplex a single ngrok URL, and nothing forces that
  # compromise any more. It stays because Metro and the API sharing one origin is
  # still convenient for a device on a phone network.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is missing from backend/.env.local}
    depends_on:
      gateway:
        condition: service_started
    ports:
      # cloudflared's own metrics, which is where /ready lives — the readiness
      # signal that replaces ngrok's tunnel-listing API. Loopback only: it
      # reports connection state, not a public surface.
      - '127.0.0.1:2000:2000'
    healthcheck:
      # /ready is 200 once at least one edge connection is registered, so the
      # container is unhealthy while the tunnel is genuinely down rather than
      # merely running.
      test: ['CMD-SHELL', 'cloudflared --version >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
