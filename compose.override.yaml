# Local development overlay.
#
# Compose loads this file automatically alongside compose.yaml whenever no
# explicit -f flags are given, so `docker compose up -d --build` is the whole
# local workflow. It is intentionally NOT loaded by the remote-beta command,
# which names its files explicitly.
#
# Host ports are shifted away from the well-known defaults so a Postgres or
# Redis already installed on the workstation does not collide with the stack.
# Nothing inside the Compose network uses these numbers — services address each
# other by name on the container port, so these exist only for inspecting the
# containers from the host.
#
# Overridable, and the defaults moved once already: the first pair collided
# with another Compose project on the same workstation, which the shift was
# supposed to prevent. A workstation running several stacks will exhaust any
# fixed choice eventually, so set REDIS_PORT or POSTGRES_PORT rather than
# editing this file.

services:
  redis:
    ports:
      - '${REDIS_PORT:-56380}:6379'

  postgres:
    ports:
      - '${POSTGRES_PORT:-55433}:5432'

  # Database administration console.
  #
  # Deliberately in this file and not compose.yaml. This overlay is not loaded
  # by the remote-beta command, so a console with full owner access to the
  # database cannot reach a deployed environment by being forgotten here — which
  # is the only reason the credentials below are allowed to have defaults.
  #
  # Bound to 127.0.0.1 rather than 0.0.0.0, unlike the other services. Those
  # publish an API and a web app; this publishes an authenticated shell over the
  # whole database, and the office network is one where client isolation and
  # ad-hoc devices are already known quantities. Localhost keeps it on the
  # workstation running it.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      # A real domain, because pgAdmin validates this and rejects reserved TLDs
      # — `.local` fails with "special-use or reserved name" and the container
      # then restart-loops. It is a local login name, never an address anything
      # is sent to, and is deliberately not an app account.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin@texasrenters.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin}
      # Left in server mode, which is the image's default. Desktop mode
      # (SERVER_MODE=False) skips the login screen but moves the listener from
      # 80 to 5050, so the published port silently answers nothing.
    volumes:
      # Pre-registers both connections so nobody has to remember that the host
      # is `postgres` and the port is 5432 rather than the shifted host port.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5480}:80'
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    environment:
      NODE_ENV: development
      APP_ENV: local
      # Real authentication, because the admin app in this workspace signs in
      # against a real Supabase project and talks to a real database.
      #
      # Mock auth does not verify the bearer token at all — it ignores whoever
      # signed in and resolves a hardcoded id, defaulting to the technician
      # seed. So a real administrator signing in was answered as a deactivated
      # @local.test technician, which surfaced as "Account is disabled" on a
      # perfectly good account. Two halves of one login disagreeing about who
      # the user is.
      #
      # Set USE_MOCK_AUTH=true to work against the seeded mock users instead,
      # and pair it with MOCK_AUTH_DEFAULT_USER_ID — the default resolves to a
      # technician, which the administrator app cannot use.
      USE_MOCK_AUTH: ${USE_MOCK_AUTH:-false}
      FLOOR_PLAN_EXTRACTION_PROVIDER: mock
      VIDEO_PLATFORM_PROVIDER: mock
      TRANSCRIPTION_PROVIDER: mock
      AI_ANALYSIS_PROVIDER: mock
      JOB_QUEUE_PROVIDER: memory
      FLOOR_PLAN_STORAGE_PROVIDER: local
    # DATABASE_URL and DIRECT_URL are deliberately absent here. Compose
    # `environment:` outranks `env_file:`, so setting them would silently
    # override whatever backend/.env.local holds — and during the migration off
    # Supabase, which of the two databases is live is exactly the thing that
    # must stay under one file's control.
    #
    # To run against the Postgres container, set both in backend/.env.local to
    # `postgresql://postgres:postgres@postgres:5432/texasrenters?schema=public`
    # (host `postgres`, the service name — `localhost` would resolve to the
    # backend container itself). See docs/migration/SUPABASE_TO_SELF_HOSTED.md.
    ports:
      - '${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'

  web:
    ports:
      - '${WEB_PORT:-5454}:${WEB_PORT:-5454}'

volumes:
  # Named, so saved connections and query history survive `docker compose down`.
  # `down -v` would take it with the database, which is its own reason not to
  # run that here.
  pgadmin-data:
