services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: texasrenters
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - texasrenters_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d texasrenters']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/texasrenters?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/texasrenters?schema=public
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: 'true'
      CACHE_PROVIDER: redis
      CACHE_FAIL_OPEN: 'true'
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:8081,http://localhost:19006
      MOBILE_APP_ORIGIN: http://localhost:8081
      WEB_APP_ORIGIN: http://localhost:3001
      USE_MOCK_AUTH: 'true'
      FLOOR_PLAN_EXTRACTION_PROVIDER: mock
      VIDEO_PLATFORM_PROVIDER: mock
      TRANSCRIPTION_PROVIDER: mock
      AI_ANALYSIS_PROVIDER: mock
      JOB_QUEUE_PROVIDER: memory
      FLOOR_PLAN_STORAGE_PROVIDER: local
    ports:
      - '3000:3000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  texasrenters_postgres:
