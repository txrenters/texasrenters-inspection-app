name: Publish images

# Builds the two deployable images and pushes them to GHCR, so a VPS pulls a
# tested artifact instead of compiling on a box with 2 GB of RAM.
#
# Releases only, plus a manual trigger. Not on every push to main: these are the
# artifacts a deployment runs, and a tag is the thing someone can point at when
# asked what is in production.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: the run number)'
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR. GITHUB_TOKEN has no package scope by default,
      # and the push fails with a 403 that reads like a credential problem.
      packages: write
    strategy:
      # Independent images; a failure in one should not hide the state of the
      # other. `fail-fast: false` so a broken web build still reports whether
      # the backend was fine.
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend/Dockerfile
          - name: web
            dockerfile: docker/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          # `latest` only from a release. A workflow_dispatch build is a
          # one-off, and moving `latest` from one would silently change what the
          # next `docker compose pull` on the VPS brings down.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag || github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          # amd64 only. The VPS is x86, and adding arm64 doubles the build for
          # an architecture nothing here deploys to.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Read by docker/web/Dockerfile only; the backend ignores it.
          #
          # This is the one value that cannot be corrected after the fact. Next
          # inlines NEXT_PUBLIC_* into the JavaScript bundle at build time, so a
          # published web image is permanently pinned to whichever API host was
          # set here — changing the environment variable on the server does
          # nothing at all. Set the repository variable
          # NEXT_PUBLIC_API_BASE_URL before the first release; the fallback
          # below is the production host, not a placeholder, precisely so a
          # missing variable cannot ship an image pointing at localhost.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://inspection-api.texasrenters.com' }}
            NEXT_PUBLIC_ENABLE_DEMO_DATA=false
            NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name || inputs.tag || github.run_number }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ vars.GOOGLE_MAPS_MAP_ID }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Tell production the images are in
  # ---------------------------------------------------------------------------
  #
  # The server deploys the newest release as soon as it hears this, rather than
  # at its next five-minute check. What it trusts is a token GitHub signs for
  # this job (OpenID Connect) naming this repository, this workflow and the
  # event that ran it, so no secret is kept here or on the server. See
  # backend/src/deployments and scripts/deploy/systemd/texasrenters-update.path.
  #
  # After both images, and only for a release: the server deploys releases and
  # nothing else, and one with an image missing could not be pulled.
  deploy:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # To ask GitHub for the token, and nothing else: this job reads no code.
      id-token: write
    steps:
      - name: Ask production to deploy
        env:
          AUDIENCE: texasrenters-inspection-deploy
          DEPLOY_REQUEST_URL: ${{ vars.DEPLOY_REQUEST_URL || 'https://inspection-api.texasrenters.com/api/v1/deploy-requests' }}
        # Never fails the run. The images are published either way, and a
        # request that does not land costs at most five minutes: the server's
        # own check deploys the release. It is reported as a warning instead.
        run: |
          if ! token="$(curl -fsS --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -er '.value')"; then
            echo "::warning title=Production was not asked to deploy::GitHub issued no token for the request. The server deploys ${GITHUB_REF_NAME} at its next check instead, within five minutes."
            exit 0
          fi
          echo "::add-mask::${token}"

          # Retried while the server is briefly unreachable (a proxy restart, a
          # 502), but a refusal is final.
          status="$(curl -sS --max-time 30 --retry 4 --retry-delay 10 --retry-connrefused \
            -o response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${token}" "${DEPLOY_REQUEST_URL}")" || true
          if [ "${status}" = "202" ]; then
            echo "Production is deploying ${GITHUB_REF_NAME}: $(cat response.json)"
          else
            echo "::warning title=Production was not asked to deploy::The server answered ${status:-nothing}. It deploys ${GITHUB_REF_NAME} at its next check instead, within five minutes."
            cat response.json 2>/dev/null || true
          fi
