name: Publish images

# Builds the two deployable images and pushes them to GHCR, so a VPS pulls a
# tested artifact instead of compiling on a box with 2 GB of RAM.
#
# Releases only, plus a manual trigger. Not on every push to main: these are the
# artifacts a deployment runs, and a tag is the thing someone can point at when
# asked what is in production.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: the run number)'
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR. GITHUB_TOKEN has no package scope by default,
      # and the push fails with a 403 that reads like a credential problem.
      packages: write
    strategy:
      # Independent images; a failure in one should not hide the state of the
      # other. `fail-fast: false` so a broken web build still reports whether
      # the backend was fine.
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend/Dockerfile
          - name: web
            dockerfile: docker/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          # `latest` only from a release. A workflow_dispatch build is a
          # one-off, and moving `latest` from one would silently change what the
          # next `docker compose pull` on the VPS brings down.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag || github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          # amd64 only. The VPS is x86, and adding arm64 doubles the build for
          # an architecture nothing here deploys to.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Read by docker/web/Dockerfile only; the backend ignores it.
          #
          # This is the one value that cannot be corrected after the fact. Next
          # inlines NEXT_PUBLIC_* into the JavaScript bundle at build time, so a
          # published web image is permanently pinned to whichever API host was
          # set here — changing the environment variable on the server does
          # nothing at all. Set the repository variable
          # NEXT_PUBLIC_API_BASE_URL before the first release; the fallback
          # below is the production host, not a placeholder, precisely so a
          # missing variable cannot ship an image pointing at localhost.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://inspection-api.texasrenters.com' }}
            NEXT_PUBLIC_ENABLE_DEMO_DATA=false
            NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name || inputs.tag || github.run_number }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ vars.GOOGLE_MAPS_MAP_ID }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
