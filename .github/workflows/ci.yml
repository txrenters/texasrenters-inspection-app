name: CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'backend/**'
      - 'shared/**'
      # `web/**` was missing, so a change touching only the admin console ran no
      # CI at all - no lint, no typecheck, no tests. `supabase/**` is gone with
      # the directory it watched.
      - 'web/**'
      - 'infrastructure/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - 'shared/**'
      # `web/**` was missing, so a change touching only the admin console ran no
      # CI at all - no lint, no typecheck, no tests. `supabase/**` is gone with
      # the directory it watched.
      - 'web/**'
      - 'infrastructure/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: texasrenters_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d texasrenters_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/texasrenters_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/texasrenters_test?schema=public
      REDIS_URL: redis://localhost:6379
      USE_MOCK_AUTH: 'true'
      FLOOR_PLAN_EXTRACTION_PROVIDER: mock
      VIDEO_PLATFORM_PROVIDER: mock
      TRANSCRIPTION_PROVIDER: mock
      AI_ANALYSIS_PROVIDER: mock
      JOB_QUEUE_PROVIDER: memory
      FLOOR_PLAN_STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # `shared` must be built before anything lints or typechecks against it.
      #
      # Its package exports point at ./dist, so on a clean checkout that path
      # does not exist yet and every dependent fails to resolve the package.
      # Mobile's `import/no-unresolved` was reporting exactly that - "Unable to
      # resolve path to module '@texasrenters/shared'" - on every run since the
      # workflow was written, while passing on developer machines where a stale
      # dist happened to be lying around. Same reason `db:generate` is above.
      - run: pnpm --filter @texasrenters/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
