# TexasRenters inspection platform — single Compose project.
#
# Every container in every environment belongs to the `texasrenters` project
# below. Without this `name:` key Compose falls back to the directory holding
# the file, which is how the stack previously split into a `texasrenters-
# inspection` project and a second, unrelated `infrastructure` project running
# its own Redis on its own network.
#
#   Local development      docker compose up -d --build
#   Remote iOS beta        docker compose -f compose.yaml -f compose.remote-beta.yaml up -d --build
#
# compose.override.yaml is loaded automatically and holds development-only
# settings. It is NOT loaded when -f flags are passed explicitly, which is why
# the remote-beta command above names compose.yaml as well.
name: texasrenters

# Settings shared by every backend variant. Anchors keep the overlays short and
# stop the two environments from drifting apart the way the old pair of compose
# files did.
x-backend-env: &backend-env
  HOST: 0.0.0.0
  PORT: ${BACKEND_PORT:-3000}
  # One Redis, one network, one project. The backend addresses it by service
  # name; a `localhost` value inherited from backend/.env.local would resolve to
  # the backend container itself and silently disable the cache.
  REDIS_URL: redis://redis:6379
  CACHE_ENABLED: 'true'
  CACHE_PROVIDER: redis
  CACHE_FAIL_OPEN: 'true'
  WEB_APP_ORIGIN: ${WEB_APP_ORIGIN:-http://localhost:5454}
  MOBILE_APP_ORIGIN: ${MOBILE_APP_ORIGIN:-http://localhost:8082}
  # Under remote-beta NODE_ENV is production, where main.ts skips DEVELOPMENT_ORIGINS
  # entirely — so anything not listed here is refused, and the browser reports it as
  # a missing Access-Control-Allow-Origin that reads like a backend fault.
  #
  # inspection-tx is the console's public hostname, published by the tunnel at
  # inspection-tx.erniecodev.win -> http://web:5454. 5456 is the web-shadcn dev
  # server, which talks to this same backend.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://inspection-tx.erniecodev.win,http://localhost:5454,http://localhost:5456,http://localhost:8081,http://localhost:8082,http://localhost:19006}

x-backend-healthcheck: &backend-healthcheck
  # Liveness only — deliberately not the readiness route, so container health
  # never depends on Supabase or Cloudflare being reachable.
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

services:
  # ---------------------------------------------------------------------------
  # Data services
  # ---------------------------------------------------------------------------

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # The application database.
  #
  # Was `profiles: ['local-db']` — opt-in, while Supabase was the default for
  # every environment. It is now a first-class service, because the target
  # deployment is a VPS running its own Postgres and the migration off Supabase
  # is underway (docs/migration/SUPABASE_TO_SELF_HOSTED.md).
  #
  # Still no depends_on edge from the backend. It is no longer profile-gated, so
  # one would now be safe, but the backend tolerates a database that is not yet
  # accepting connections and `restart: unless-stopped` covers the startup
  # window. Adding the edge would serialise every boot behind the healthcheck
  # for no benefit.
  #
  # DATABASE_URL decides what is actually used. Pointing it at Supabase and
  # leaving this container running is a valid state, and is exactly the state
  # during the migration.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-texasrenters}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-texasrenters}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime
    # Absent on a fresh clone; `required: false` keeps `docker compose config`
    # working before anyone has written their local credentials.
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *backend-healthcheck

  web:
    build:
      context: .
      # The admin console. Switch this single line back to docker/web/Dockerfile
      # to serve the older web-app again — nothing else about this service, the
      # port, or the tunnel differs between them.
      dockerfile: docker/web-shadcn/Dockerfile
      target: runtime
      args:
        # Next inlines NEXT_PUBLIC_* at build time, so these must be build args
        # rather than runtime environment. They are read by the browser and are
        # public by definition — never put a service-role key here.
        #
        # Compose fills these by interpolation, which reads the CLI --env-file
        # and the root .env, never a service's env_file. The values live in
        # web-shadcn/.env.local, so the pnpm docker:* scripts pass that file
        # explicitly. Build without it and the bundle inlines the default API
        # URL, and the console talks to the wrong backend.
        #
        # The two NEXT_PUBLIC_SUPABASE_* args are gone: the console signs in
        # against this backend now, and nothing in the bundle reads them.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_DEMO_DATA: ${NEXT_PUBLIC_ENABLE_DEMO_DATA:-false}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${WEB_PORT:-5454}
      # How the SERVER reaches the backend, which is not how the browser does.
      # The sign-in and refresh route handlers run inside this container, where
      # the browser's `http://localhost:3000` is this container — the same trap
      # REDIS_URL above exists to avoid. Runtime, not a build arg: it must never
      # be inlined into the bundle.
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://backend:3000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||5454)).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
