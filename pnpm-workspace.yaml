packages:
  - mobile
  - web-app
  - backend
  - shared

enableGlobalVirtualStore: false

# Expo SDK 54 supports pnpm's isolated linker, but Metro's Windows fallback
# watcher can race with pnpm's transient *_tmp_* directories in the virtual
# store. Hoisting keeps Metro's public entry path stable during development.
nodeLinker: hoisted

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  # Downloads the platform ffmpeg binary used for room-video audio extraction.
  ffmpeg-static: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - expo-camera@57.0.3
  - '@expo/cli@57.0.9'
  - '@expo/metro-config@57.0.6'
  - '@expo/prebuild-config@57.0.8'
  - expo-asset@57.0.6
  - expo-constants@57.0.6
  - expo-modules-autolinking@57.0.8
  - expo-modules-core@57.0.6
  - expo@57.0.7
  - '@expo/ui@57.0.7'
  - expo-router@57.0.7
  - '@expo/metro-runtime@57.0.6'
