map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Docker's embedded DNS, with a short cache.
  #
  # Without this nginx resolves each upstream hostname once, when the config
  # loads, and keeps that address for the life of the worker. Rebuilding the
  # backend gives its container a new IP, so the gateway carried on dialling the
  # old one and answered every request with 502 — while the backend itself was
  # perfectly healthy, which makes it look like the tunnel is at fault.
  #
  # Re-resolution only happens when the address is held in a variable, hence the
  # `set` lines below; `proxy_pass http://backend:3000` resolves at boot however
  # this resolver is configured.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Inspection media can be large. NestJS remains responsible for validating
  # file type and size; this only prevents the beta gateway from rejecting an
  # otherwise valid request first.
  client_max_body_size 2g;

  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # The versioned REST boundary always belongs to NestJS.
  location ^~ /api/ {
    # Held in a variable so the resolver above is actually consulted per
    # request. A literal hostname here is resolved once at boot regardless.
    set $api_upstream http://backend:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Socket.IO performs its transport handshake at this root path before using
  # the /technician-events namespace.
  location ^~ /socket.io/ {
    set $socket_upstream http://backend:3000;
    proxy_pass $socket_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
  }

  # Expo manifests, bundles, assets, and Fast Refresh use every other path.
  # Metro runs on the Windows host; Docker Desktop exposes it through this
  # special hostname without publishing Metro on a second public tunnel.
  location / {
    set $metro_upstream http://host.docker.internal:8082;
    proxy_pass $metro_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;
  }
}
